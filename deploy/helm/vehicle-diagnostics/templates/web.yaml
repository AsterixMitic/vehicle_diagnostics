{{- $v := .Values.web }}
{{- $ctx := dict "root" $ "component" "web" }}
# The dashboard (ADR-0005). Its nginx proxies /api/ to http://api:8080, which is why the host's
# Service keeps the Compose name.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vehicle-diagnostics.labels" $ctx | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "vehicle-diagnostics.selectorLabels" $ctx | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "vehicle-diagnostics.labels" $ctx | nindent 8 }}
    spec:
      enableServiceLinks: false
      containers:
        - name: web
          image: {{ include "vehicle-diagnostics.image" $v.image }}
          imagePullPolicy: {{ $v.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 80
          # Readiness is serving the application only. Coupling it to the host would take the
          # dashboard out of service on every host restart; the Helm test checks the proxy.
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            failureThreshold: 3
          resources:
            {{- toYaml $v.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vehicle-diagnostics.labels" $ctx | nindent 4 }}
spec:
  selector:
    {{- include "vehicle-diagnostics.selectorLabels" $ctx | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http
{{- if $v.ingress.enabled }}
---
# Traefik (k3s's default controller) streams responses without buffering and has no write
# timeout, so the live stream passes through it as it does through nginx.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vehicle-diagnostics.labels" $ctx | nindent 4 }}
spec:
  {{- with $v.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  name: http
      {{- with $v.ingress.host }}
      host: {{ . | quote }}
      {{- end }}
{{- end }}
