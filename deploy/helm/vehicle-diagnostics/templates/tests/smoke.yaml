{{- $ctx := dict "root" $ "component" "smoke-test" }}
# `helm test <release>`: fails unless the host reports exactly "Healthy" and a read request
# through the dashboard's proxy returns the host's JSON (design D10).
apiVersion: v1
kind: Pod
metadata:
  name: smoke-test
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vehicle-diagnostics.labels" $ctx | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  activeDeadlineSeconds: 60
  enableServiceLinks: false
  containers:
    - name: smoke-test
      image: {{ include "vehicle-diagnostics.image" .Values.busybox.image }}
      imagePullPolicy: {{ .Values.busybox.image.pullPolicy }}
      command:
        - sh
        - -c
        - |
          set -e
          health="$(wget -qO- -T 5 http://api:8080/health)"
          echo "api /health: $health"
          [ "$health" = "Healthy" ]
          devices="$(wget -qO- -T 5 http://web/api/devices)"
          echo "web /api/devices: $devices"
          case "$devices" in
            \[*) echo "smoke test passed" ;;
            *) echo "not a JSON array"; exit 1 ;;
          esac
      resources:
        {{- toYaml .Values.busybox.resources | nindent 8 }}
