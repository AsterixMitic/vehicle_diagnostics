{{- $c := .Values.credentials }}
apiVersion: v1
kind: Secret
metadata:
  name: vehicle-diagnostics-credentials
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vehicle-diagnostics.labels" (dict "root" $ "component" "credentials") | nindent 4 }}
type: Opaque
stringData:
  postgres-password: {{ $c.postgresPassword | quote }}
  rabbitmq-user: {{ $c.rabbitmqUser | quote }}
  rabbitmq-password: {{ $c.rabbitmqPassword | quote }}
  # The host reads these as ConnectionStrings__telemetrydb and ConnectionStrings__rabbitmq.
  telemetrydb-connection: {{ printf "Host=timescaledb;Port=5432;Database=%s;Username=postgres;Password=%s" .Values.timescaledb.database $c.postgresPassword | quote }}
  rabbitmq-connection: {{ printf "amqp://%s:%s@rabbitmq:5672" (urlquery $c.rabbitmqUser) (urlquery $c.rabbitmqPassword) | quote }}
