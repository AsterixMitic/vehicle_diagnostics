{{- $v := .Values.api }}
{{- $ctx := dict "root" $ "component" "api" }}
# The monolith host. Exactly one replica, replaced rather than rolled (ADR-0006): the host
# subscribes to the device topics without shared subscriptions, so two instances, even during
# a rolling update's overlap, would ingest every message twice.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vehicle-diagnostics.labels" $ctx | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "vehicle-diagnostics.selectorLabels" $ctx | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "vehicle-diagnostics.labels" $ctx | nindent 8 }}
      annotations:
        # Connection strings live in the Secret; restart the host when they change.
        checksum/credentials: {{ toJson .Values.credentials | sha256sum }}
    spec:
      enableServiceLinks: false
      # The schema initialization at startup needs the database, and ingestion needs both
      # brokers: start only once all three accept connections (design D5).
      initContainers:
        {{- include "vehicle-diagnostics.waitFor" (dict "root" $ "targets" (list (printf "mosquitto:%v" .Values.mosquitto.service.port) "timescaledb:5432" "rabbitmq:5672")) | nindent 8 }}
      containers:
        - name: api
          image: {{ include "vehicle-diagnostics.image" $v.image }}
          imagePullPolicy: {{ $v.image.pullPolicy }}
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: {{ $v.environment | quote }}
            - name: ConnectionStrings__telemetrydb
              valueFrom:
                secretKeyRef:
                  name: vehicle-diagnostics-credentials
                  key: telemetrydb-connection
            - name: Mqtt__Host
              value: mosquitto
            - name: Mqtt__Port
              value: {{ .Values.mosquitto.service.port | quote }}
            - name: ConnectionStrings__rabbitmq
              valueFrom:
                secretKeyRef:
                  name: vehicle-diagnostics-credentials
                  key: rabbitmq-connection
            {{- if .Values.aspireDashboard.enabled }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ printf "http://aspire-dashboard:%v" .Values.aspireDashboard.service.otlpPort | quote }}
            {{- else if $v.otlpEndpoint }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ $v.otlpEndpoint | quote }}
            {{- end }}
            - name: OTEL_SERVICE_NAME
              value: api
            # Every span and metric names the pod, namespace and node that produced it.
            - name: K8S_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: K8S_NAMESPACE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: K8S_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: k8s.pod.name=$(K8S_POD_NAME),k8s.namespace.name=$(K8S_NAMESPACE_NAME),k8s.node.name=$(K8S_NODE_NAME)
          ports:
            - name: http
              containerPort: 8080
          startupProbe:
            httpGet:
              path: /alive
              port: http
            periodSeconds: 2
            failureThreshold: 30
          # Readiness includes every dependency (503 when any is degraded): about 15 s after
          # one is lost, the host leaves service.
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          # Liveness is the process only, so a database outage never restarts the host.
          livenessProbe:
            httpGet:
              path: /alive
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml $v.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vehicle-diagnostics.labels" $ctx | nindent 4 }}
spec:
  selector:
    {{- include "vehicle-diagnostics.selectorLabels" $ctx | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
