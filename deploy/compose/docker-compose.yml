# Local stack as containers — the second orchestration path next to the Aspire AppHost.
#
#   docker compose up -d --build                  # broker + database + dashboard + host
#   docker compose --profile demo up -d --build   # ... plus a virtual device publishing telemetry
#   docker compose --profile demo down -v         # stop and remove everything, including data
#
# Dev-only posture (ADR-0003): anonymous broker, plain TCP, unauthenticated dashboard,
# all ports bound to localhost.

name: vehiclediagnostics

services:
  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "127.0.0.1:1883:1883"
    volumes:
      - ../../edge/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    healthcheck:
      # A real subscription round-trip, not just an open port.
      test: ["CMD", "mosquitto_sub", "-h", "localhost", "-t", "$$SYS/#", "-C", "1", "-i", "healthcheck", "-W", "3"]
      interval: 5s
      timeout: 5s
      retries: 6

  timescaledb:
    image: timescale/timescaledb:latest-pg17
    environment:
      POSTGRES_DB: telemetrydb
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - telemetry-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d telemetrydb"]
      interval: 5s
      timeout: 5s
      retries: 12

  rabbitmq:
    # Internal bus between bounded contexts (ADR-0004). Management UI on 15672.
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    healthcheck:
      # The AMQP listener opens only once the node has booted. Not `rabbitmq-diagnostics ping`:
      # every call starts an Erlang VM with a scheduler per core, about 6 CPU-seconds, which
      # would disturb the latencies under measurement.
      test: ["CMD", "nc", "-z", "-w", "3", "127.0.0.1", "5672"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  aspire-dashboard:
    # OTLP receiver + trace/metric/log UI; no storage to manage. Built from a one-line
    # derived image that adds a static busybox so the distroless base can probe itself.
    # The host's OTLP exporter buffers and retries, so the dashboard never gates ingestion.
    build:
      context: ./aspire-dashboard
    environment:
      DOTNET_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS: "true"
    ports:
      - "127.0.0.1:18888:18888"   # UI
      - "127.0.0.1:18889:18889"   # OTLP gRPC, for hosts running outside compose
    healthcheck:
      # Follows the UI redirect and requires a 200.
      test: ["CMD", "/bin/busybox", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:18888/"]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 15s

  api:
    build:
      context: ../..
      dockerfile: backend/src/Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__telemetrydb: Host=timescaledb;Port=5432;Database=telemetrydb;Username=postgres;Password=${POSTGRES_PASSWORD:-postgres}
      Mqtt__Host: mosquitto
      Mqtt__Port: "1883"
      ConnectionStrings__rabbitmq: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672
      OTEL_EXPORTER_OTLP_ENDPOINT: http://aspire-dashboard:18889
      OTEL_SERVICE_NAME: api
    ports:
      - "127.0.0.1:5080:8080"
    depends_on:
      mosquitto:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      aspire-dashboard:
        condition: service_started
    healthcheck:
      # Readiness endpoint via bash's /dev/tcp (the runtime image has neither curl nor wget).
      # Whole-line match so "Unhealthy" cannot pass.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && grep -qx Healthy <&3"]
      interval: 5s
      timeout: 5s
      # start_period already covers startup, so three consecutive failures (~15 s) is
      # enough to flag a lost dependency without false alarms.
      retries: 3
      start_period: 20s

  web:
    # The dashboard (ADR-0005): nginx serves the Angular build and forwards /api to the host.
    build:
      context: ../../frontend
    ports:
      - "127.0.0.1:4280:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      # Healthy only when it serves the application and its proxy reaches the backend.
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1/ && wget -qO /dev/null http://127.0.0.1/api/devices"]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 5s

  virtual-device:
    profiles: ["demo"]
    build:
      context: ../..
      dockerfile: experiments/load-generator/VirtualDevice/Dockerfile
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: "1883"
      VEHICLE_ID: car-01
      DEVICE_ID_PREFIX: ${DEVICE_PREFIX:-esp32}
      RATE_HZ: "1"
      DEVICE_COUNT: "1"
      # P0 publishes raw OBD-II frames (backend decodes); P2 publishes decoded signals.
      PROCESSING_MODE: ${DEVICE_MODE:-P2}
      HEARTBEAT_FILE: /tmp/heartbeat
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      # The device touches the heartbeat file after every successful publish; healthy means
      # it published within the last 30 s, i.e. it is connected and actually sending.
      test: ["CMD", "bash", "-c", "find /tmp/heartbeat -mmin -0.5 | grep -q ."]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  telemetry-data:
