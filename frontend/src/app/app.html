<mat-toolbar class="bar">
  <span class="brand">Дијагностика возила</span>
  <nav aria-label="Главна навигација">
    @for (item of nav; track item.path) {
      <a
        mat-button
        [routerLink]="item.path"
        routerLinkActive="active"
        ariaCurrentWhenActive="page"
        >{{ item.label }}</a
      >
    }
  </nav>
</mat-toolbar>

<main class="page">
  <router-outlet />
</main>
