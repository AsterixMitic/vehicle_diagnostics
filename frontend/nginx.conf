# The dashboard and the backend behind one origin (design D9): the browser only ever talks to
# this server, so no CORS configuration exists anywhere.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Server-Sent Events: hand every event to the browser as it is written, and keep a quiet
        # stream open; buffering would hold events back until a buffer fills.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    # Hashed build output never changes under the same name.
    location ~* \.(?:js|css|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Any application route (/live, /evaluation?range=1h, ...) is served the application.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
